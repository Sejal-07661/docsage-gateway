<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocSage - AI Document Q&A</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <h1>📄 DocSage</h1>
    <p class="subtitle">Ask questions about your documents</p>

    <div id="authBox" class="card">
      <div class="tabs">
        <button id="loginTab" class="tab active">Login</button>
        <button id="signupTab" class="tab">Sign Up</button>
      </div>

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <form id="signupForm" style="display:none;">
        <input type="text" id="signupName" placeholder="Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <button type="submit">Sign Up</button>
      </form>

      <p id="authError" class="error"></p>
    </div>

    <div id="appBox" class="card" style="display:none;">
      <div class="header-row">
        <h2 id="welcomeMsg"></h2>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <div class="upload-section">
        <input type="file" id="fileInput" accept="application/pdf">
        <button id="uploadBtn">Upload Document</button>
        <span id="uploadStatus"></span>
      </div>

      <div id="documentsList"></div>

      <div class="chat-section">
        <div id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="questionInput" placeholder="Ask a question about your documents...">
          <button id="askBtn">Ask</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
